# Cada 30 minutos lee la hoja y actualiza las vistas previas de los enlaces compartidos (carpeta r/).
name: Vistas previas de relojes
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config.js, scripts/vistas_previas.py, .github/workflows/vistas-previas.yml]
permissions:
  contents: write
concurrency: vistas-previas
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - run: python scripts/vistas_previas.py
      - name: Guardar cambios
        run: |
          git add -A r
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Vistas previas actualizadas"
          git push
